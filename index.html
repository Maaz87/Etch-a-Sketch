<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a Sketch</title>
    <style>
        #container{
            width: 960px;
            display: flex;
            flex-wrap: wrap;
            gap: 0;

        }
        .square{
            background-color: grey;
            box-sizing: border-box;
            border: 1px solid black;
        }
        .square:hover{
            background-color: antiquewhite;
            border: 1px solid greenyellow;
        }
    </style>
</head>
<body>
   <div id="container"></div>

   <script>
    
    const cont = document.querySelector("#container");

    const btn =document.createElement("button");
    btn.textContent="Create New Grid";
    btn.style.backgroundColor="yellow";
    btn.style.margin="10px";
    btn.style.padding="20px";
    btn.style.borderRadius="10px";
    btn.style.alignSelf="center";
    cont.before(btn);

    function sketchMaker(value) {
            cont.innerHTML="";

        let size = 960/value;
        for(let i=1; i<= value; i++) 
       {
           for(let j=1; j<=value; j++)
            {
            const sq_div = document.createElement("div");
            sq_div.classList.add("square");
            sq_div.style.height=`${size}px`;
            sq_div.style.width=`${size}px`;
            cont.appendChild(sq_div);
    
        }
    
       }
    }

    sketchMaker(16);
    
   btn.addEventListener('click',() =>  
    {let val=prompt("Enter NxN valueS (maximum value should not be greater than 100):",0);
    let num=Number(val);
    if (num>100) {
        alert("Wrong Input Please Enter Correct input");

    }
    else 
    sketchMaker(num);
   });

    
   </script>
</body>
</html>
